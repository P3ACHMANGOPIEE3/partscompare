<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartsCompare</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="banner" role="note">Demo build. Synthetic data only. Login, rules and saving are simulated in your browser, not a real backend.</div>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#/">
        <svg width="32" height="32" viewBox="0 0 96 96" aria-hidden="true" class="logo-icon-svg">
          <rect class="brand-logo-rect" width="96" height="96" rx="22" />
          <rect class="brand-logo-bar1" x="20" y="22" width="36" height="10" rx="5" />
          <rect class="brand-logo-bar2" x="20" y="44" width="44" height="10" rx="5" />
          <rect class="brand-logo-bar3" x="20" y="66" width="30" height="10" rx="5" />
          <circle class="brand-logo-circle" cx="70" cy="49" r="13" />
          <path class="brand-logo-check" d="M63.5 49.5l4.5 4.5 8.5-9" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span><span class="b1">Parts</span><span class="b2">Compare</span></span>
      </a>
      <nav id="nav" aria-label="Main"></nav>
      <div id="who"></div>
      <!-- Dark mode switch button -->
      <button type="button" id="theme-toggle" class="theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <script src="fixtures.js"></script>
  <script src="adapter.js"></script>
  <script src="art.js"></script>
  <script src="landing.js"></script>
  <script src="app.js"></script>
</body>
</html>
